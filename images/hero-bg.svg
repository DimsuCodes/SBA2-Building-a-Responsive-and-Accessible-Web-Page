<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0B4A45"/>
    </linearGradient>
  </defs>
  <!-- Dark gradient so white text on top has strong contrast -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Soft decorative shapes -->
  <circle cx="1350" cy="150" r="260" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1450" cy="700" r="180" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="150" cy="820" r="220" fill="#FFFFFF" opacity="0.04"/>
  <rect x="1050" y="380" width="300" height="200" rx="24" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.08"/>
  <rect x="1100" y="430" width="300" height="200" rx="24" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.06"/>
</svg>
